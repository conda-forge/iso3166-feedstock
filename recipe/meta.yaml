{% set name = "iso3166" %}
{% set version = "3.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e567b55d169211d4d499c73307350da15df5d38248e60bae559609570c42ef55

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - iso3166

about:
  home: https://github.com/deactivated/python-iso3166
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Standalone ISO 3166-1 country definitions

  description: |
    ISO 3166-1 defines two-letter, three-letter, and three-digit country codes.
    python-iso3166 is a self-contained module that converts between these codes
    and the corresponding country name.
  dev_url: https://github.com/deactivated/python-iso3166

extra:
  recipe-maintainers:
    - johnhany97
